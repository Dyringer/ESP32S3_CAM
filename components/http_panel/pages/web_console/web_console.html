<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32-S3 CAM &mdash; Console</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #ccc;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 16px;
      gap: 10px;
    }

    header {
      display: flex;
      align-items: baseline;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 1.1em; color: #eee; }

    header a {
      font-size: .85em;
      color: #1976d2;
      text-decoration: none;
    }

    header a:hover { text-decoration: underline; }

    #status { font-size: .78em; color: #888; margin-left: auto; }

    .toolbar {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .btn {
      padding: 5px 12px;
      border: 1px solid #444;
      border-radius: 4px;
      background: #2a2a2a;
      color: #ccc;
      cursor: pointer;
      font-size: .8em;
    }

    .btn:hover { background: #333; }

    #terminal {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #333;
      border-radius: 6px 6px 0 0;
      padding: 10px 12px;
      overflow-y: auto;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: .82em;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #input-row {
      display: flex;
      gap: 0;
      flex-shrink: 0;
    }

    #prompt {
      background: #0d0d0d;
      border: 1px solid #333;
      border-top: none;
      border-right: none;
      border-radius: 0 0 0 6px;
      padding: 7px 8px;
      color: #50fa7b;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: .82em;
      flex-shrink: 0;
      user-select: none;
    }

    #cmd {
      flex: 1;
      background: #0d0d0d;
      border: 1px solid #333;
      border-top: none;
      border-left: none;
      border-radius: 0 0 6px 0;
      padding: 7px 8px;
      color: #f8f8f2;
      font-family: 'Cascadia Code', 'Consolas', 'Courier New', monospace;
      font-size: .82em;
      outline: none;
      caret-color: #50fa7b;
    }

    /* Log level colours */
    .lvl-e { color: #ff5555; }
    .lvl-w { color: #ffb86c; }
    .lvl-i { color: #50fa7b; }
    .lvl-d { color: #8be9fd; }
    .lvl-v { color: #666;    }
    .lvl-cmd { color: #bd93f9; } /* echoed command */
  </style>
</head>
<body>

  <header>
    <h1>&#x1F4F7; Console</h1>
    <a href="/">Dashboard</a>
    <a href="/camera">Camera</a>
    <a href="/ota">OTA</a>
    <span id="status">Connecting...</span>
  </header>

  <div class="toolbar">
    <button class="btn" onclick="clearTerm()">Clear</button>
    <button class="btn" onclick="toggleScroll()">
      Auto-scroll: <span id="lbl_scroll">ON</span>
    </button>
  </div>

  <div id="terminal"></div>

  <div id="input-row">
    <span id="prompt">&#x276F;&nbsp;</span>
    <input id="cmd" type="text" autocomplete="off" autocorrect="off"
           autocapitalize="off" spellcheck="false"
           placeholder="type a command and press Enter">
  </div>

  <script>
    var ws, retry;
    var autoScroll = true;
    var term  = document.getElementById('terminal');
    var input = document.getElementById('cmd');

    /* Command history — navigated with arrow keys */
    var history = [];
    var histIdx = -1;
    var histDraft = '';

    var ansiRe = /\x1b\[[0-9;]*[a-zA-Z]/g;
    function stripAnsi(s) { return s.replace(ansiRe, ''); }

    function levelClass(line) {
      if (line.slice(0, 2) === '> ') { return 'lvl-cmd'; }
      var m = line.match(/^([EWIDV]) \(/);
      if (!m) { return ''; }
      return { E: 'lvl-e', W: 'lvl-w', I: 'lvl-i', D: 'lvl-d', V: 'lvl-v' }[m[1]] || '';
    }

    function appendLine(raw) {
      var line = stripAnsi(raw);
      if (line === '') { return; }
      var span = document.createElement('span');
      var cls  = levelClass(line);
      if (cls) { span.className = cls; }
      span.textContent = line;
      term.appendChild(span);
      if (autoScroll) { term.scrollTop = term.scrollHeight; }
    }

    function clearTerm() { term.innerHTML = ''; }

    function toggleScroll() {
      autoScroll = !autoScroll;
      document.getElementById('lbl_scroll').textContent = autoScroll ? 'ON' : 'OFF';
    }

    function sendCmd() {
      var cmd = input.value.trim();
      if (!cmd) { return; }
      if (ws && ws.readyState === 1) {
        ws.send(cmd);
      }
      /* Push to history, reset index */
      if (history.length === 0 || history[history.length - 1] !== cmd) {
        history.push(cmd);
      }
      histIdx  = -1;
      histDraft = '';
      input.value = '';
    }

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') {
        sendCmd();
        return;
      }

      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (history.length === 0) { return; }
        if (histIdx === -1) {
          histDraft = input.value;
          histIdx   = history.length - 1;
        } else if (histIdx > 0) {
          histIdx--;
        }
        input.value = history[histIdx];
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx === -1) { return; }
        if (histIdx < history.length - 1) {
          histIdx++;
          input.value = history[histIdx];
        } else {
          histIdx     = -1;
          input.value = histDraft;
        }
      }
    });

    /* Focus input when clicking anywhere in the terminal area */
    term.addEventListener('click', function () { input.focus(); });

    function conn() {
      ws = new WebSocket('ws://' + location.host + '/console/ws');

      ws.onopen = function () {
        clearTimeout(retry);
        document.getElementById('status').textContent = 'Connected';
        input.focus();
      };

      ws.onmessage = function (e) { appendLine(e.data); };

      ws.onclose = function () {
        document.getElementById('status').textContent = 'Reconnecting...';
        retry = setTimeout(conn, 3000);
      };

      ws.onerror = function () { ws.close(); };
    }

    conn();
  </script>
</body>
</html>
