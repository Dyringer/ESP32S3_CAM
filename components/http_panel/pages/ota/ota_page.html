<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32-S3 CAM — OTA</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: sans-serif;
      background: #1a1a1a;
      color: #ccc;
      max-width: 560px;
      margin: 32px auto;
      padding: 16px;
    }

    h1 {
      font-size: 1.4em;
      margin-bottom: 4px;
      color: #eee;
    }

    p.sub {
      color: #888;
      font-size: .85em;
      margin-top: 4px;
    }

    nav {
      margin-top: 6px;
      font-size: .85em;
    }

    nav a {
      color: #1976d2;
      text-decoration: none;
      margin-right: 12px;
    }

    nav a:hover {
      text-decoration: underline;
    }

    .card {
      background: #242424;
      border-radius: 10px;
      padding: 16px;
      margin-top: 16px;
      border: 1px solid #333;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 1em;
      color: #888;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td {
      padding: 5px 4px;
      font-size: .9em;
      border-bottom: 1px solid #2e2e2e;
    }

    td:first-child {
      color: #888;
      width: 55%;
    }

    td:last-child {
      font-weight: bold;
      text-align: right;
      color: #f8f8f2;
    }

    #dropzone {
      border: 2px dashed #444;
      border-radius: 10px;
      padding: 32px 16px;
      text-align: center;
      color: #888;
      cursor: pointer;
      transition: border-color .15s, color .15s;
    }

    #dropzone.drag {
      border-color: #1976d2;
      color: #ccc;
    }

    #file_input {
      display: none;
    }

    .btn {
      padding: 9px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: .9em;
      font-weight: bold;
    }

    .btn-primary {
      background: #1976d2;
      color: #fff;
    }

    .btn-primary:hover {
      background: #125a9c;
    }

    .btn-primary:disabled {
      background: #333;
      color: #777;
      cursor: default;
    }

    progress {
      width: 100%;
      height: 18px;
      margin-top: 14px;
      accent-color: #1976d2;
    }

    #pct {
      font-size: .85em;
      color: #888;
      margin-top: 6px;
    }

    #result {
      margin-top: 14px;
      font-size: .9em;
    }

    #result.ok {
      color: #66bb6a;
    }

    #result.err {
      color: #e57373;
    }
  </style>
</head>

<body>
  <h1>&#x1F4F7; ESP32-S3 CAM — OTA Update</h1>
  <p class="sub" id="status">Connecting...</p>
  <nav>
    <a href="/">Dashboard</a>
    <a href="/camera">Camera</a>
    <a href="/console">Console</a>
  </nav>

  <div class="card">
    <h2>Device</h2>
    <table id="t_info"></table>
  </div>

  <div class="card">
    <h2>Upload firmware</h2>
    <div id="dropzone">Drag &amp; drop a .bin here, or click to choose a file</div>
    <input type="file" id="file_input" accept=".bin">
    <progress id="bar" max="100" value="0" style="display:none"></progress>
    <div id="pct"></div>
    <div id="result"></div>
  </div>

  <script>
    var ws, retry;
    var xhr = null;
    var running_version = '';

    function conn() {
      ws = new WebSocket('ws://' + location.host + '/ota/ws');

      ws.onopen = function () {
        clearTimeout(retry);
        document.getElementById('status').textContent = 'Connected';
      };

      ws.onmessage = function (e) { onProgress(JSON.parse(e.data)); };

      ws.onclose = function () {
        document.getElementById('status').textContent = 'Reconnecting...';
        retry = setTimeout(conn, 3000);
      };

      ws.onerror = function () { ws.close(); };
    }

    function onProgress(d) {
      /* Corroborating channel — the XHR upload progress event already
       * drives the bar during the upload itself; this mainly covers the
       * validating/applying phase after the upload body finishes sending. */
      if (d.bytes_expected > 0) {
        var pct = Math.round(100 * d.bytes_written / d.bytes_expected);
        setBar(pct, d.state);
      }

      if (d.state === 'failed' && d.error) {
        showResult(false, 'Update failed: ' + d.error);
      }
    }

    function setBar(pct, label) {
      var bar = document.getElementById('bar');
      bar.style.display = '';
      bar.value = pct;
      document.getElementById('pct').textContent = label + ' — ' + pct + '%';
    }

    function showResult(ok, msg) {
      var el = document.getElementById('result');
      el.className = ok ? 'ok' : 'err';
      el.innerHTML = msg;
    }

    function fill(id, arr) {
      var h = '';
      for (var i = 0; i < arr.length; i++) {
        h += '<tr><td>' + arr[i].label + '</td><td>' + arr[i].value + '</td></tr>';
      }
      document.getElementById(id).innerHTML = h;
    }

    function renderInfo() {
      fill('t_info', [{ label: 'Running version', value: running_version || '?' }]);
    }

    function fetchVersion() {
      fetch('/ota/version').then(function (r) { return r.json(); })
        .then(function (d) {
          running_version = d.version;
          renderInfo();
        })
        .catch(function () { });
    }

    function upload(file) {
      if (xhr) { return; }

      showResult(true, '');
      document.getElementById('bar').style.display = '';
      setBar(0, 'uploading');

      xhr = new XMLHttpRequest();
      xhr.open('POST', '/ota/upload');
      xhr.setRequestHeader('Content-Type', 'application/octet-stream');

      xhr.upload.onprogress = function (e) {
        if (e.lengthComputable) {
          setBar(Math.round(100 * e.loaded / e.total), 'uploading');
        }
      };

      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) { return; }

        var status = xhr.status;
        var body = {};
        try { body = JSON.parse(xhr.responseText); } catch (e) { }

        if (status === 200 && body.ok) {
          setBar(100, 'applied');
          showResult(true, 'Update applied.' + rebootControls());
        } else {
          showResult(false, 'Upload failed: ' + (body.error || ('HTTP ' + status)));
        }

        xhr = null;
      };

      xhr.onerror = function () {
        showResult(false, 'Upload failed: network error');
        xhr = null;
      };

      xhr.send(file);
    }

    var reboot_timer = null;
    var reboot_secs = 5;

    function rebootControls() {
      reboot_secs = 5;
      reboot_timer = setInterval(tickReboot, 1000);
      return '<br><button class="btn btn-primary" id="btn_reboot" onclick="doReboot()">' +
        'Reboot now (' + reboot_secs + ')</button>' +
        '<br><a href="#" onclick="cancelReboot();return false;" style="font-size:.85em">cancel</a>';
    }

    function tickReboot() {
      reboot_secs--;
      var btn = document.getElementById('btn_reboot');
      if (!btn) { clearInterval(reboot_timer); return; }
      if (reboot_secs <= 0) {
        clearInterval(reboot_timer);
        doReboot();
        return;
      }
      btn.textContent = 'Reboot now (' + reboot_secs + ')';
    }

    function cancelReboot() {
      clearInterval(reboot_timer);
      var btn = document.getElementById('btn_reboot');
      if (btn) { btn.textContent = 'Reboot now'; }
    }

    function doReboot() {
      clearInterval(reboot_timer);
      if (ws && ws.readyState === 1) {
        ws.send(JSON.stringify({ action: 'reboot' }));
      }
      showResult(true, 'Rebooting...');
    }

    var dz = document.getElementById('dropzone');
    var fi = document.getElementById('file_input');

    dz.addEventListener('click', function () { fi.click(); });

    dz.addEventListener('dragover', function (e) {
      e.preventDefault();
      dz.classList.add('drag');
    });

    dz.addEventListener('dragleave', function () { dz.classList.remove('drag'); });

    dz.addEventListener('drop', function (e) {
      e.preventDefault();
      dz.classList.remove('drag');
      if (e.dataTransfer.files.length > 0) { upload(e.dataTransfer.files[0]); }
    });

    fi.addEventListener('change', function () {
      if (fi.files.length > 0) { upload(fi.files[0]); }
    });

    fetchVersion();
    conn();
  </script>
</body>

</html>
