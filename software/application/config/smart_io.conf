# smart_io: the ADC1 stream callback keeps running during flash writes, so the
# sample count (and with it every sample time) stays exact.
CONFIG_ADC_CONTINUOUS_ISR_IRAM_SAFE=y

# smart_io: UART RX keeps filling the driver buffer during flash writes (the
# 128 B FIFO overflows in ~1.3 ms at 1 Mbaud).
CONFIG_UART_ISR_IN_IRAM=y
