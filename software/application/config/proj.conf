# Project-wide sdkconfig defaults. Board-specific target, flash size, PSRAM and
# partition table live in boards/<board>/sdkconfig.board.

CONFIG_ESP_CONSOLE_UART_DEFAULT=y
CONFIG_ESP_CONSOLE_UART_NUM=0
CONFIG_ESP_CONSOLE_UART_BAUDRATE=115200

CONFIG_LOG_DEFAULT_LEVEL_INFO=y
CONFIG_LOG_MAXIMUM_LEVEL_DEBUG=y
CONFIG_LOG_COLORS=y

# Headroom as app_main grows
CONFIG_ESP_MAIN_TASK_STACK_SIZE=8192

# At the default 100 Hz, pdMS_TO_TICKS() below 10 ms rounds down to 0 ticks.
CONFIG_FREERTOS_HZ=1000

# Per-task CPU time for the CPU load readout (components/sysmon). The 64-bit
# counter never wraps; the 32-bit one overflows after ~71 minutes.
CONFIG_FREERTOS_GENERATE_RUN_TIME_STATS=y
CONFIG_FREERTOS_RUN_TIME_STATS_USING_ESP_TIMER=y
CONFIG_FREERTOS_RUN_TIME_COUNTER_TYPE_U64=y
CONFIG_FREERTOS_VTASKLIST_INCLUDE_COREID=y

# IDF 6 places the kernel in flash; every task switch, queue and mutex call
# then risks a cache miss, worst right after OTA/NVS flash writes flush the
# cache. Costs ~10-15 KB of internal RAM (IRAM and heap share DIRAM).
CONFIG_FREERTOS_IN_IRAM=y

# Bootloader reverts an image that never calls
# esp_ota_mark_app_valid_cancel_rollback() (main.c). The only recovery path on
# the factory-less 2-slot partition table — without it a bad OTA bricks.
CONFIG_BOOTLOADER_APP_ROLLBACK_ENABLE=y

# Required by http_panel
CONFIG_HTTPD_WS_SUPPORT=y

# ESP-IDF 6.0 (commit c9daea6, issue #18539): the WS URI handler no longer sees
# the handshake GET; fd registration needs ws_post_handshake_cb.
CONFIG_HTTPD_WS_POST_HANDSHAKE_CB_SUPPORT=y

# httpd takes 16 sessions + 3 internal sockets; the remaining 4 keep
# snapshot_upload and DNS working while the panel is full. The default of 10
# drops WS upgrades.
CONFIG_LWIP_MAX_SOCKETS=23

# 16 httpd sessions + snapshot_upload + headroom for PCBs still in TIME_WAIT.
# The default of 16 would refuse connections before the socket limit is hit.
# PCBs are heap-allocated, so the limit costs no RAM until used.
CONFIG_LWIP_MAX_ACTIVE_TCP=24

# Also sizes httpd's work queue: IDF 6.1 httpd_queue_work() takes a counting
# semaphore of this size and returns ESP_FAIL when it is full, so pushers retry
# (smart_io_ws keeps its changes and responses until queued). Kept at 8: it
# applies to every UDP socket, and each queued datagram pins a WiFi RX buffer.
CONFIG_LWIP_UDP_RECVMBOX_SIZE=8

# The smart_io protocol nests 3 levels; the parser recurses once per level, so
# the default (1000) lets one 2 KB "[[[[..." request overflow the sio_ws or
# httpd stack.
CONFIG_CJSON_NESTING_LIMIT=8

# tcpip_thread on the WiFi core. Unpinned, it floats onto Core 1 where
# cam_task (prio 23) preempts it, and every packet hops cores.
CONFIG_LWIP_TCPIP_TASK_AFFINITY_CPU0=y

# mbedTLS contexts in PSRAM: a TLS handshake (snapshot_upload) otherwise takes
# ~40 KB of internal RAM at once.
CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC=y

# malloc() above 4 KB goes to PSRAM (default 16 KB). Network bursts take the
# internal heap down to its minimum; this moved medium buffers (iperf, httpd,
# cJSON) out of the way: min free under load 11 -> 39 KB (measured).
CONFIG_SPIRAM_MALLOC_ALWAYSINTERNAL=4096

# Lets large static buffers live in PSRAM via EXT_RAM_BSS_ATTR (web console
# ring, data_manager table, OTA upload chunk, scan result, sysmon tasks):
# internal free +45 KB, largest block 56 -> 104 KB (measured).
CONFIG_SPIRAM_ALLOW_BSS_SEG_EXTERNAL_MEMORY=y

CONFIG_LWIP_TCP_SND_BUF_DEFAULT=32768

# Block Ack window per the WiFi help (9-12 for throughput).
CONFIG_ESP_WIFI_TX_BA_WIN=12


# OV3660 only — other sensor drivers compiled out for fast probing and a
# smaller image.
# CONFIG_OV7670_SUPPORT is not set
# CONFIG_OV7725_SUPPORT is not set
# CONFIG_NT99141_SUPPORT is not set
# CONFIG_OV2640_SUPPORT is not set
CONFIG_OV3660_SUPPORT=y
# CONFIG_OV3640_SUPPORT is not set
# CONFIG_OV5640_SUPPORT is not set
# CONFIG_GC2145_SUPPORT is not set
# CONFIG_GC032A_SUPPORT is not set
# CONFIG_GC0308_SUPPORT is not set
# CONFIG_BF3005_SUPPORT is not set
# CONFIG_BF20A6_SUPPORT is not set
# CONFIG_SC101IOT_SUPPORT is not set
# CONFIG_SC030IOT_SUPPORT is not set
# CONFIG_SC031GS_SUPPORT is not set
# CONFIG_HM1055_SUPPORT is not set
# CONFIG_HM0360_SUPPORT is not set
# CONFIG_MEGA_CCM_SUPPORT is not set

# Frame-copy task off Core 0, which belongs to WiFi.
CONFIG_CAMERA_CORE1=y
