<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ESP32S3 — Console</title>
  <link rel="stylesheet" href="/panel.css">
  <style>
    /* Terminal stays dark in the light theme too, for log colour contrast. */
    #terminal {
      height: 60vh;
      min-height: 280px;
      overflow-y: auto;
      background: #07080b;
      color: #d4d8e0;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm) var(--radius-sm) 0 0;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: .82em;
      line-height: 1.45;
      white-space: pre-wrap;
      word-break: break-all;
    }

    #input-row {
      display: flex;
      align-items: center;
      background: #07080b;
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius-sm) var(--radius-sm);
      transition: border-color .15s;
    }

    #input-row:focus-within { border-color: var(--accent); }

    #prompt {
      flex: none;
      padding: 0 0 0 12px;
      color: #6ee7a0;
      font-family: var(--mono);
      font-size: .82em;
      user-select: none;
    }

    #cmd {
      flex: 1;
      background: transparent;
      border: none;
      border-radius: 0;
      box-shadow: none;
      padding: 9px 8px;
      color: #e6e9ef;
      font-family: var(--mono);
      font-size: .82em;
      caret-color: #6ee7a0;
    }

    .lvl-e { color: #f87171; }
    .lvl-w { color: #fbbf24; }
    .lvl-i { color: #6ee7a0; }
    .lvl-d { color: #7dd3fc; }
    .lvl-v { color: #6b7280; }
    .lvl-cmd { color: #a5b4fc; }
  </style>
</head>

<body>
  <header id="panel-header"></header>
  <script src="/panel.js"></script>

  <main class="panel-main">
    <div class="card">
      <div class="card-head">
        <h2>Console</h2>
        <button class="btn btn-secondary btn-sm" onclick="clearTerm()">Clear</button>
        <button class="btn btn-secondary btn-sm" onclick="toggleScroll()">
          Auto-scroll: <span id="lbl_scroll">ON</span>
        </button>
      </div>

      <div id="terminal"></div>

      <form id="input-row" autocomplete="off">
        <span id="prompt">&#x276F;&nbsp;</span>
        <input id="cmd" type="text" autocomplete="off" autocorrect="off"
          autocapitalize="off" spellcheck="false" enterkeyhint="send"
          placeholder="type a command and press Enter">
      </form>
    </div>
  </main>

  <script>
    var ws, retry;
    var autoScroll = true;
    var term  = document.getElementById('terminal');
    var input = document.getElementById('cmd');

    var cmdHistory = [];
    var histIdx = -1;
    var histDraft = '';

    var ansiRe = /\x1b\[[0-9;]*[a-zA-Z]/g;
    function stripAnsi(s) { return s.replace(ansiRe, ''); }

    function levelClass(line) {
      if (line.slice(0, 2) === '> ') { return 'lvl-cmd'; }
      var m = line.match(/^([EWIDV]) \(/);
      if (!m) { return ''; }
      return { E: 'lvl-e', W: 'lvl-w', I: 'lvl-i', D: 'lvl-d', V: 'lvl-v' }[m[1]] || '';
    }

    function appendLine(raw) {
      var line = stripAnsi(raw);
      if (line === '') { return; }
      var span = document.createElement('span');
      var cls  = levelClass(line);
      if (cls) { span.className = cls; }
      span.textContent = line;
      term.appendChild(span);
      if (autoScroll) { term.scrollTop = term.scrollHeight; }
    }

    function clearTerm() { term.innerHTML = ''; }

    function toggleScroll() {
      autoScroll = !autoScroll;
      document.getElementById('lbl_scroll').textContent = autoScroll ? 'ON' : 'OFF';
    }

    function sendCmd() {
      var cmd = input.value.trim();
      if (!cmd) { return; }
      if (ws && ws.readyState === 1) {
        ws.send(cmd);
      }
      if (cmdHistory.length === 0 || cmdHistory[cmdHistory.length - 1] !== cmd) {
        cmdHistory.push(cmd);
      }
      histIdx  = -1;
      histDraft = '';
      input.value = '';
    }

    document.getElementById('input-row').addEventListener('submit', function (e) {
      e.preventDefault();
      sendCmd();
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowUp') {
        e.preventDefault();
        if (cmdHistory.length === 0) { return; }
        if (histIdx === -1) {
          histDraft = input.value;
          histIdx   = cmdHistory.length - 1;
        } else if (histIdx > 0) {
          histIdx--;
        }
        input.value = cmdHistory[histIdx];
        return;
      }

      if (e.key === 'ArrowDown') {
        e.preventDefault();
        if (histIdx === -1) { return; }
        if (histIdx < cmdHistory.length - 1) {
          histIdx++;
          input.value = cmdHistory[histIdx];
        } else {
          histIdx     = -1;
          input.value = histDraft;
        }
      }
    });

    term.addEventListener('click', function () { input.focus(); });

    function conn() {
      ws = new WebSocket('ws://' + location.host + '/console/ws');

      ws.onopen = function () {
        clearTimeout(retry);
        panelStatus('Connected', 'ok');
        input.focus();
      };

      ws.onmessage = function (e) { appendLine(e.data); };

      ws.onclose = function () {
        panelStatus('Reconnecting...', 'busy');
        retry = setTimeout(conn, 3000);
      };

      ws.onerror = function () { ws.close(); };
    }

    conn();
  </script>
</body>

</html>
