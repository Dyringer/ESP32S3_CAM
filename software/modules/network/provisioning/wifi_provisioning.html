<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WiFi Setup</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --surface: #242424;
      --surface-2: #2e2e2e;
      --border: #333;
      --text: #eee;
      --text-dim: #888;
      --accent: #1976d2;
      --accent-hover: #1e88e5;
      --accent-soft: rgba(25, 118, 210, .18);
      --ok: #43a047;
      --ok-soft: rgba(67, 160, 71, .16);
      --warn: #f57c00;
      --warn-soft: rgba(245, 124, 0, .16);
      --danger: #e53935;
      --danger-soft: rgba(229, 57, 53, .16);
      --radius: 10px;
      --radius-sm: 6px;
      --shadow: none;
      color-scheme: dark;
    }

    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f4f6fa;
        --surface: #ffffff;
        --surface-2: #f0f2f7;
        --border: #e2e6ee;
        --text: #171b24;
        --text-dim: #5b6475;
        --accent-soft: rgba(25, 118, 210, .10);
        --shadow: 0 1px 2px rgba(16, 24, 40, .06), 0 6px 20px rgba(16, 24, 40, .06);
        color-scheme: light;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font: 15px/1.5 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      max-width: 560px;
      margin: 0 auto;
      padding: 32px 16px 48px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      font-size: 1.4em;
      font-weight: 650;
      letter-spacing: -.01em;
    }

    p.sub {
      color: var(--text-dim);
      font-size: .88em;
      margin-top: 4px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .card h2 {
      margin-bottom: 14px;
      font-size: .95em;
      font-weight: 600;
    }

    label {
      display: block;
      margin-top: 14px;
      font-size: .8em;
      color: var(--text-dim);
    }

    select,
    input[type=text],
    input[type=password] {
      width: 100%;
      margin-top: 6px;
      padding: 8px 10px;
      font: inherit;
      font-size: .95em;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    select:focus,
    input[type=text]:focus,
    input[type=password]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 16px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 9px 16px;
      border: 1px solid transparent;
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: .88em;
      font-weight: 550;
      line-height: 1.2;
      cursor: pointer;
      white-space: nowrap;
      transition: background .15s, transform .05s;
    }

    .btn:active { transform: translateY(1px); }

    .btn-connect {
      background: var(--accent);
      color: #fff;
    }

    .btn-connect:hover { background: var(--accent-hover); }

    .btn-scan {
      background: var(--surface-2);
      color: var(--text);
    }

    .btn-scan:hover { background: var(--border); }

    .lbl-check {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 12px;
      cursor: pointer;
    }

    .lbl-check input {
      width: 18px;
      height: 18px;
      margin: 0;
      cursor: pointer;
      accent-color: var(--accent);
    }

    #msg {
      margin-top: 14px;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--surface-2);
      font-size: .88em;
    }

    #msg:empty { display: none; }

    #msg.ok {
      background: var(--ok-soft);
      border-color: color-mix(in srgb, var(--ok) 35%, transparent);
      color: var(--ok);
    }

    #msg.err {
      background: var(--danger-soft);
      border-color: color-mix(in srgb, var(--danger) 35%, transparent);
      color: var(--danger);
    }

    #msg.inf { color: var(--text-dim); }
  </style>
</head>

<body>
  <header>
    <h1>&#x1F4F6; WiFi Setup</h1>
    <p class="sub">Select a network or type its name, then enter the password.</p>
  </header>

  <div class="card">
    <h2>Available Networks</h2>
    <select id="ssid_list" onchange="pickNet(this)">
      <option disabled selected>Scanning...</option>
    </select>
    <div class="actions">
      <button class="btn btn-scan" onclick="scan()">&#x21BB; Refresh</button>
    </div>
  </div>

  <div class="card">
    <h2>Credentials</h2>
    <label>Network name</label>
    <input type="text" id="ssid" placeholder="Select above or type manually">

    <label>Password</label>
    <input type="password" id="pass" placeholder="Leave blank for open networks">

    <label class="lbl-check">
      <input type="checkbox" id="show_pass" onchange="togglePass()">
      Show password
    </label>

    <div class="actions">
      <button class="btn btn-connect" onclick="connect()">Connect</button>
    </div>
    <div id="msg"></div>
  </div>

  <script>
    function pickNet(sel) {
      document.getElementById('ssid').value = sel.value;
    }

    function togglePass() {
      var p = document.getElementById('pass');
      p.type = document.getElementById('show_pass').checked ? 'text' : 'password';
    }

    function scan() {
      var s = document.getElementById('ssid_list');
      s.innerHTML = '<option disabled selected>Scanning...</option>';
      fetch('/scan')
        .then(function (r) { return r.json(); })
        .then(function (nets) {
          // Placeholder first, so picking even a single network fires onchange.
          s.innerHTML = '<option disabled selected>Select a network…</option>';
          nets.forEach(function (n) {
            var o = document.createElement('option');
            o.value = n.ssid;
            o.text = n.ssid + ' (' + n.rssi + ' dBm)';
            s.appendChild(o);
          });
          if (!nets.length) {
            s.innerHTML = '<option disabled selected>No networks found</option>';
          }
        })
        .catch(function () {
          s.innerHTML = '<option disabled>Scan failed \u2014 try refresh</option>';
        });
    }

    function connect() {
      var ssid = document.getElementById('ssid').value.trim();
      var pass = document.getElementById('pass').value;
      var msg  = document.getElementById('msg');

      if (!ssid) {
        msg.className = 'err';
        msg.textContent = 'Please enter a network name.';
        return;
      }

      msg.className = 'inf';
      msg.textContent = 'Connecting...';

      fetch('/configure', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ssid: ssid, pass: pass }),
      })
        .then(function (r) { return r.json(); })
        .then(function (r) {
          if (r.ok) {
            msg.className = 'ok';
            msg.textContent = 'Done! Device is connecting to "' + ssid + '". ' +
              'If it can’t connect, it returns to this setup page after a restart.';
          } else {
            msg.className = 'err';
            msg.textContent = 'Error: ' + r.error;
          }
        })
        .catch(function () {
          msg.className = 'err';
          msg.textContent = 'No reply from the device. If its setup WiFi has disappeared, ' +
            'it is connecting; otherwise try again.';
        });
    }

    scan();
  </script>
</body>

</html>
